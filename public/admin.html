<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TikTok Order Collector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .role-super_admin { background: #fef3c7; color: #92400e; }
        .role-admin { background: #dbeafe; color: #1e40af; }
        .role-staff { background: #d1fae5; color: #065f46; }
        .role-user { background: #f3f4f6; color: #374151; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <div class="bg-white border-b shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="/" class="text-gray-400 hover:text-gray-600 text-sm">← App</a>
                <h1 class="text-lg font-bold text-gray-800">🛡️ Admin Panel</h1>
                <span id="admin-role" class="text-[10px] px-2 py-0.5 rounded-full font-bold"></span>
                <span id="dev-mode-badge" class="hidden text-[10px] px-2 py-0.5 rounded-full font-bold bg-amber-100 text-amber-700 border border-amber-200">DEV MODE</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="admin-email" class="text-xs text-gray-400"></span>
                <button onclick="location.href='/'" class="text-xs bg-gray-100 px-3 py-1.5 rounded hover:bg-gray-200 transition">Quay lại App</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Toolbar -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
            <div>
                <h2 class="text-xl font-bold text-gray-800">Quản lý tài khoản</h2>
                <p class="text-xs text-gray-400" id="user-count-label"></p>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <input type="text" id="search-input" placeholder="Tìm email hoặc tên..." class="flex-1 sm:w-64 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" oninput="filterUsers()">
                <button onclick="showCreateModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition whitespace-nowrap">+ Thêm user</button>
            </div>
        </div>

        <!-- Users Table -->
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-[11px] uppercase text-gray-500">
                        <tr>
                            <th class="p-3 text-left">User</th>
                            <th class="p-3 text-left">Role</th>
                            <th class="p-3 text-left hidden md:table-cell">Provider</th>
                            <th class="p-3 text-center">Trạng thái</th>
                            <th class="p-3 text-left hidden lg:table-cell">Ngày tạo</th>
                            <th class="p-3 text-left hidden lg:table-cell">Đăng nhập gần nhất</th>
                            <th class="p-3 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody"></tbody>
                </table>
            </div>
            <div id="loading-msg" class="text-center py-10 text-gray-400">Đang tải...</div>
        </div>
    </div>

    <!-- Create/Edit User Modal -->
    <div id="user-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-lg">Thêm tài khoản</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-black text-xl">✕</button>
            </div>
            <div class="p-4 space-y-3">
                <input type="hidden" id="edit-uid">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Email *</label>
                    <input type="email" id="modal-email" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="user@example.com">
                </div>
                <div id="password-field">
                    <label class="block text-xs font-bold text-gray-500 mb-1">Mật khẩu</label>
                    <input type="password" id="modal-password" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Tối thiểu 6 ký tự">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Tên hiển thị</label>
                    <input type="text" id="modal-name" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Nguyễn Văn A">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">Role</label>
                    <select id="modal-role" class="w-full border rounded-lg px-3 py-2 text-sm">
                        <option value="user">User</option>
                        <option value="staff">Staff</option>
                        <option value="admin">Admin</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                </div>
                <div id="modal-error" class="text-red-500 text-xs font-bold hidden"></div>
            </div>
            <div class="p-4 border-t flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">Hủy</button>
                <button onclick="submitModal()" id="modal-submit-btn" class="px-4 py-2 text-sm bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700">Lưu</button>
            </div>
        </div>
    </div>

    <!-- Live Sessions Modal -->
    <div id="sessions-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h3 id="sessions-title" class="font-bold text-lg">Lịch sử phiên live</h3>
                <button onclick="document.getElementById('sessions-modal').classList.add('hidden')" class="text-gray-400 hover:text-black text-xl">✕</button>
            </div>
            <div id="sessions-content" class="overflow-y-auto p-4 flex-1"></div>
        </div>
    </div>

    <script>
        let allUsers = [];
        let currentUser = null;

        // Load current admin info
        (async () => {
            const res = await fetch('/api/me');
            const data = await res.json();
            if (!data.loggedIn) return location.href = '/login';
            currentUser = data.user;
            document.getElementById('admin-email').textContent = data.user.email;
            const roleEl = document.getElementById('admin-role');
            roleEl.textContent = data.user.role;
            roleEl.className = `text-[10px] px-2 py-0.5 rounded-full font-bold role-${data.user.role}`;
            if (data.devSkipAuth) {
                document.getElementById('dev-mode-badge').classList.remove('hidden');
            }
            // Restrict role options for non-super_admin
            if (data.user.role !== 'super_admin') {
                const opts = document.getElementById('modal-role').options;
                for (let i = opts.length - 1; i >= 0; i--) {
                    if (opts[i].value === 'admin' || opts[i].value === 'super_admin') opts.remove(i);
                }
            }
            loadUsers();
        })();

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                if (res.status === 403) return location.href = '/';
                const data = await res.json();
                allUsers = data.users || [];
                document.getElementById('user-count-label').textContent = `${allUsers.length} tài khoản`;
                renderUsers(allUsers);
            } catch (e) {
                document.getElementById('loading-msg').textContent = 'Lỗi tải dữ liệu';
            }
        }

        function filterUsers() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = allUsers.filter(u =>
                (u.email || '').toLowerCase().includes(q) ||
                (u.displayName || '').toLowerCase().includes(q)
            );
            renderUsers(filtered);
        }

        function fmtDate(d) { return d ? new Date(d).toLocaleDateString('vi-VN') : '-'; }
        function fmtMoney(n) { return new Intl.NumberFormat('vi-VN').format(n); }

        function renderUsers(users) {
            document.getElementById('loading-msg').style.display = 'none';
            const tbody = document.getElementById('users-tbody');
            tbody.innerHTML = users.map(u => {
                const provider = u.providerData?.[0]?.providerId === 'google.com' ? '🟢 Google' : '📧 Email';
                const status = u.disabled
                    ? '<span class="bg-red-100 text-red-600 px-2 py-0.5 rounded-full text-[10px] font-bold">Khóa</span>'
                    : '<span class="bg-green-100 text-green-600 px-2 py-0.5 rounded-full text-[10px] font-bold">Active</span>';
                const isSelf = u.uid === currentUser?.uid;
                return `<tr class="border-t hover:bg-gray-50 transition ${u.disabled ? 'opacity-60' : ''}">
                    <td class="p-3">
                        <div class="flex items-center gap-2">
                            <img src="${u.photoURL || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22><rect fill=%22%23ddd%22 width=%2240%22 height=%2240%22/><text x=%2250%%22 y=%2255%%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23999%22>?</text></svg>'}" class="w-8 h-8 rounded-full border">
                            <div><p class="font-bold text-xs truncate max-w-[160px]">${u.displayName || u.email?.split('@')[0] || '-'}</p><p class="text-[10px] text-gray-400">${u.email}</p></div>
                        </div>
                    </td>
                    <td class="p-3"><span class="role-${u.role} px-2 py-0.5 rounded-full text-[10px] font-bold">${u.role}</span></td>
                    <td class="p-3 text-xs text-gray-500 hidden md:table-cell">${provider}</td>
                    <td class="p-3 text-center">${status}</td>
                    <td class="p-3 text-[10px] text-gray-400 hidden lg:table-cell">${fmtDate(u.creationTime)}</td>
                    <td class="p-3 text-[10px] text-gray-400 hidden lg:table-cell">${fmtDate(u.lastSignInTime)}</td>
                    <td class="p-3 text-center">
                        <div class="flex justify-center gap-1 flex-wrap">
                            <button onclick="editUser('${u.uid}')" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded hover:bg-blue-100" title="Sửa">✏️</button>
                            <button onclick="toggleDisable('${u.uid}', ${u.disabled})" class="text-[10px] ${u.disabled ? 'bg-green-50 text-green-600' : 'bg-yellow-50 text-yellow-600'} px-2 py-1 rounded hover:opacity-80" title="${u.disabled ? 'Mở khóa' : 'Khóa'}">${u.disabled ? '🔓' : '🔒'}</button>
                            <button onclick="viewSessions('${u.uid}', '${(u.displayName || u.email).replace(/'/g, "\\'")}')" class="text-[10px] bg-purple-50 text-purple-600 px-2 py-1 rounded hover:bg-purple-100" title="Phiên live">📋</button>
                            ${!isSelf ? `<button onclick="deleteUser('${u.uid}', '${u.email}')" class="text-[10px] bg-red-50 text-red-600 px-2 py-1 rounded hover:bg-red-100" title="Xóa">🗑️</button>` : ''}
                        </div>
                    </td>
                </tr>`;
            }).join('');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-10 text-gray-400">Không tìm thấy user</td></tr>';
            }
        }

        // --- Modal ---
        let editMode = false;
        function showCreateModal() {
            editMode = false;
            document.getElementById('modal-title').textContent = 'Thêm tài khoản';
            document.getElementById('edit-uid').value = '';
            document.getElementById('modal-email').value = '';
            document.getElementById('modal-email').disabled = false;
            document.getElementById('modal-password').value = '';
            document.getElementById('modal-name').value = '';
            document.getElementById('modal-role').value = 'user';
            document.getElementById('password-field').querySelector('label').textContent = 'Mật khẩu *';
            document.getElementById('modal-error').classList.add('hidden');
            document.getElementById('user-modal').classList.remove('hidden');
        }

        function editUser(uid) {
            const u = allUsers.find(x => x.uid === uid);
            if (!u) return;
            editMode = true;
            document.getElementById('modal-title').textContent = 'Sửa tài khoản';
            document.getElementById('edit-uid').value = uid;
            document.getElementById('modal-email').value = u.email;
            document.getElementById('modal-email').disabled = true;
            document.getElementById('modal-password').value = '';
            document.getElementById('modal-name').value = u.displayName || '';
            document.getElementById('modal-role').value = u.role;
            document.getElementById('password-field').querySelector('label').textContent = 'Mật khẩu mới (bỏ trống nếu không đổi)';
            document.getElementById('modal-error').classList.add('hidden');
            document.getElementById('user-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('user-modal').classList.add('hidden'); }

        async function submitModal() {
            const errEl = document.getElementById('modal-error');
            errEl.classList.add('hidden');
            const uid = document.getElementById('edit-uid').value;
            const email = document.getElementById('modal-email').value.trim();
            const password = document.getElementById('modal-password').value;
            const displayName = document.getElementById('modal-name').value.trim();
            const role = document.getElementById('modal-role').value;

            if (!editMode && (!email || !password)) {
                errEl.textContent = 'Email và mật khẩu là bắt buộc'; errEl.classList.remove('hidden'); return;
            }

            try {
                let res;
                if (editMode) {
                    const body = { displayName, role };
                    if (password) body.password = password;
                    res = await fetch(`/api/admin/users/${uid}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                } else {
                    res = await fetch('/api/admin/users', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, displayName, role })
                    });
                }
                const data = await res.json();
                if (res.ok && (data.success)) {
                    closeModal();
                    if (data.message) alert(data.message);
                    loadUsers();
                } else {
                    errEl.textContent = data.error || 'Lỗi không xác định'; errEl.classList.remove('hidden');
                }
            } catch (e) { errEl.textContent = 'Lỗi: ' + e.message; errEl.classList.remove('hidden'); }
        }

        async function toggleDisable(uid, isDisabled) {
            const action = isDisabled ? 'enable' : 'disable';
            const msg = isDisabled ? 'Mở khóa tài khoản này?' : 'Khóa tài khoản này?';
            if (!confirm(msg)) return;
            try {
                const res = await fetch(`/api/admin/users/${uid}/${action}`, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'Lỗi');
                loadUsers();
            } catch (e) { alert('Lỗi: ' + e.message); }
        }

        async function deleteUser(uid, email) {
            if (!confirm(`Xóa tài khoản ${email}? Dữ liệu phiên live sẽ được giữ lại.`)) return;
            try {
                const res = await fetch(`/api/admin/users/${uid}`, { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'Lỗi');
                loadUsers();
            } catch (e) { alert('Lỗi: ' + e.message); }
        }

        async function viewSessions(uid, name) {
            document.getElementById('sessions-title').textContent = `Phiên live: ${name}`;
            document.getElementById('sessions-content').innerHTML = '<p class="text-center text-gray-400 py-6">Đang tải...</p>';
            document.getElementById('sessions-modal').classList.remove('hidden');
            try {
                const res = await fetch(`/api/admin/users/${uid}/live-sessions`);
                const data = await res.json();
                const sessions = data.sessions || [];
                if (sessions.length === 0) {
                    document.getElementById('sessions-content').innerHTML = '<p class="text-center text-gray-400 py-10">Chưa có phiên live nào</p>';
                    return;
                }
                document.getElementById('sessions-content').innerHTML = sessions.map(s => `
                    <div class="p-3 border rounded-lg mb-2 hover:bg-gray-50">
                        <div class="flex justify-between items-center">
                            <div><p class="font-bold text-sm">${s.liveName}</p><p class="text-[10px] text-gray-400">${new Date(s.createdAt).toLocaleString('vi-VN')}${s.tiktokUsername ? ' • @' + s.tiktokUsername : ''}</p></div>
                            <div class="text-right"><span class="text-xs font-bold text-red-500">${fmtMoney(s.summary?.totalRevenue || 0)}đ</span><p class="text-[9px] text-gray-400">${s.summary?.totalOrders || 0} đơn</p></div>
                        </div>
                    </div>
                `).join('');
            } catch (e) { document.getElementById('sessions-content').innerHTML = '<p class="text-red-400 text-center py-6">Lỗi tải</p>'; }
        }
    </script>
</body>
</html>
