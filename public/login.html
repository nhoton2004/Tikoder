<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - TikTok Order Collector</title>
    <meta name="description" content="Đăng nhập vào hệ thống quản lý đơn hàng TikTok Live">
    <style>
        @font-face {
            font-family: "Geist";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("/fonts/geist-vietnamese-wght-normal.woff2") format("woff2-variations");
            unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303, U+0309, U+0323, U+1EA0-1EF9, U+20AB;
        }

        @font-face {
            font-family: "Geist";
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url("/fonts/geist-latin-wght-normal.woff2") format("woff2-variations");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --brand: #E8002D;
            --brand-hot: #ff2b55;
            --brand-cyan: #00D4FF;
            --surface: #ffffff;
            --surface-dim: #f6f7f9;
            --border: #dfe4ea;
            --text: #111827;
            --muted: #667085;
            --shadow: 0 24px 80px rgba(15, 23, 42, 0.16);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Geist", "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            background:
                radial-gradient(circle at 14% 18%, rgba(232, 0, 45, 0.06), transparent 30%),
                radial-gradient(circle at 88% 12%, rgba(0, 212, 255, 0.08), transparent 28%),
                linear-gradient(180deg, #ffffff 0%, #f6f7f9 58%, #eef2f6 100%);
            padding: 12px;
            -webkit-font-smoothing: antialiased;
        }

        .auth-shell {
            position: relative;
            width: min(1120px, 100%);
            min-height: min(760px, calc(100vh - 24px));
            display: grid;
            grid-template-columns: minmax(360px, 1.08fr) minmax(320px, 0.72fr);
            overflow: hidden;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 6px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .brand-panel {
            min-height: 100%;
            display: flex;
            align-items: center;
            background: linear-gradient(145deg, var(--brand-hot), #ff2352 56%, #fb1749);
            color: #fff;
            padding: clamp(34px, 7vw, 72px);
        }

        .brand-content {
            max-width: 460px;
        }

        .brand-cart {
            width: clamp(52px, 7vw, 78px);
            height: clamp(52px, 7vw, 78px);
            margin-bottom: clamp(28px, 6vw, 54px);
        }

        .brand-cart svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .brand-title {
            max-width: 520px;
            font-size: clamp(50px, 7.8vw, 88px);
            line-height: 0.93;
            font-weight: 900;
            letter-spacing: -0.055em;
        }

        .brand-sub {
            max-width: 390px;
            margin-top: clamp(18px, 3vw, 30px);
            color: rgba(255, 255, 255, 0.92);
            font-size: clamp(15px, 1.55vw, 20px);
            line-height: 1.45;
            font-weight: 550;
        }

        .form-panel-wrap {
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(28px, 6vw, 64px);
            background: #fff;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
        }

        .form-heading {
            margin-bottom: 28px;
        }

        .form-heading h1 {
            color: #111827;
            font-size: clamp(24px, 2.5vw, 34px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -0.035em;
        }

        .form-heading p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .tab-switcher {
            display: flex;
            border: 1px solid #e6eaf0;
            background: #f1f3f6;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            min-height: 40px;
            padding: 0 14px;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.16s ease, color 0.16s ease;
        }

        .tab-btn.active {
            background: var(--brand-hot);
            color: #fff;
        }

        .tab-btn:hover:not(.active) {
            color: var(--text);
        }

        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeSlide 0.3s ease-out; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            font-size: 10px;
            font-weight: 900;
            color: #111827;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .field-input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            background: var(--surface-dim);
            border: 1px solid var(--border);
            border-radius: 0;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
            outline: none;
        }

        .field-input::placeholder { color: #98a2b3; }
        .field-input:focus {
            border-color: var(--brand-hot);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 43, 85, 0.12);
        }

        .btn-primary {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.16s ease, transform 0.16s ease;
            background: var(--brand-hot);
            color: #fff;
            box-shadow: none;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            background: #e9244d;
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 28px 0;
            gap: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eef1f4;
        }

        .divider span {
            font-size: 10px;
            color: var(--muted);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .btn-google {
            width: 100%;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: 0;
            background: #fff;
            color: var(--text);
            font-family: inherit;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
        }

        .btn-google:hover {
            background: #f8fafc;
            border-color: #cfd6df;
            transform: translateY(-1px);
        }

        .btn-google:active { transform: translateY(0); }

        .btn-google svg { width: 20px; height: 20px; }

        /* Messages */
        .msg-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 0;
            font-size: 13px;
            font-weight: 700;
            display: none;
            animation: fadeSlide 0.2s ease-out;
        }

        .msg-box.error {
            display: block;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
        }

        .msg-box.success {
            display: block;
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
            color: #047857;
        }

        .dev-mode-note {
            display: none;
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 0;
            font-size: 12px;
            font-weight: 600;
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 800px) {
            body {
                align-items: stretch;
                padding: 0;
                background: #fff;
            }

            .auth-shell {
                min-height: 100vh;
                width: 100%;
                grid-template-columns: 1fr;
                border: 0;
                border-radius: 0;
            }

            .brand-panel {
                min-height: 310px;
                padding: 34px 28px;
            }

            .brand-cart {
                width: 52px;
                height: 52px;
                margin-bottom: 24px;
            }

            .brand-title {
                font-size: clamp(46px, 14vw, 64px);
            }

            .brand-sub {
                font-size: 14px;
                max-width: 320px;
            }

            .form-panel-wrap {
                align-items: flex-start;
                padding: 34px 24px 44px;
            }

            .login-card {
                max-width: 100%;
            }
        }

        @media (max-width: 375px) {
            .brand-panel {
                min-height: 280px;
                padding: 28px 22px;
            }

            .form-panel-wrap {
                padding: 28px 18px 38px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <section class="brand-panel" aria-label="TikTok Order Collector">
            <div class="brand-content">
                <div class="brand-cart" aria-hidden="true">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 3h2l.42 2M7 13h10.2c.55 0 1.03-.33 1.23-.84L21 5H5.42M7 13 5.42 5M7 13l-2.18 2.18c-.63.63-.18 1.7.7 1.7H18M9 20a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Zm10 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
                    </svg>
                </div>
                <div class="brand-title">TikTok<br>Order<br>Collector</div>
                <p class="brand-sub">Quản lý đơn hàng chuyên nghiệp cho doanh nghiệp của bạn.</p>
            </div>
        </section>

        <main class="form-panel-wrap">
            <div class="login-card">
                <header class="form-heading">
                    <h1>Đăng nhập</h1>
                    <p>Chào mừng bạn quay trở lại hệ thống.</p>
                </header>

                <div class="tab-switcher">
                    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Đăng nhập</button>
                    <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Đăng ký</button>
                </div>

                <div id="panel-login" class="form-panel active">
                    <div class="field-group">
                        <label class="field-label" for="login-email">Email</label>
                        <input type="email" id="login-email" class="field-input" placeholder="admin@example.com" autocomplete="email">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="login-password">Mật khẩu</label>
                        <input type="password" id="login-password" class="field-input" placeholder="••••••••" autocomplete="current-password">
                    </div>
                    <div class="field-group" style="margin-bottom: 10px;">
                        <label style="display: flex; align-items: center; cursor: pointer; font-size: 13px; font-weight: 600; color: #374151;">
                            <input type="checkbox" id="remember-me" style="margin-right: 8px; width: 16px; height: 16px; cursor: pointer;">
                            Nhớ đăng nhập
                        </label>
                    </div>
                    <button id="btn-login" class="btn-primary">Đăng nhập</button>
                </div>

                <div id="panel-register" class="form-panel">
                    <div class="field-group">
                        <label class="field-label" for="reg-email">Email</label>
                        <input type="email" id="reg-email" class="field-input" placeholder="email@example.com" autocomplete="email">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="reg-password">Mật khẩu</label>
                        <input type="password" id="reg-password" class="field-input" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="reg-confirm">Xác nhận mật khẩu</label>
                        <input type="password" id="reg-confirm" class="field-input" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
                    </div>
                    <button id="btn-register" class="btn-primary">Đăng ký</button>
                </div>

                <div class="divider"><span>hoặc</span></div>
                <button id="btn-google" class="btn-google">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Đăng nhập bằng Google
                </button>

                <div id="dev-mode-note" class="dev-mode-note"></div>
                <div id="msg-box" class="msg-box"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAiCx0hRxK3IIJqHOs3e4xZsM5apUZXsU",
            authDomain: "tikoder-app.firebaseapp.com",
            projectId: "tikoder-app",
            storageBucket: "tikoder-app.firebasestorage.app",
            messagingSenderId: "195318473503",
            appId: "1:195318473503:web:6e10d19826c59956ec062a",
            measurementId: "G-ZBTFLL6VD4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();
        let isDevSkipAuth = false;

        // --- UI Helpers ---
        const msgBox = document.getElementById('msg-box');

        function showMsg(text, type = 'error') {
            msgBox.textContent = text;
            msgBox.className = `msg-box ${type}`;
        }

        function clearMsg() {
            msgBox.textContent = '';
            msgBox.className = 'msg-box';
        }

        function showDevNote(text) {
            const note = document.getElementById('dev-mode-note');
            note.textContent = text;
            note.style.display = 'block';
        }

        function setLoading(btn, loading) {
            if (loading) {
                btn.disabled = true;
                btn.dataset.originalText = btn.textContent;
                btn.innerHTML = '<span class="spinner"></span>Đang xử lý...';
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.originalText || btn.textContent;
            }
        }

        function translateError(error) {
            const code = error.code || '';
            const map = {
                'auth/email-already-in-use': 'Email này đã được sử dụng. Vui lòng đăng nhập hoặc dùng email khác.',
                'auth/weak-password': 'Mật khẩu quá yếu. Vui lòng dùng ít nhất 6 ký tự.',
                'auth/invalid-email': 'Địa chỉ email không hợp lệ.',
                'auth/user-not-found': 'Sai email hoặc mật khẩu.',
                'auth/wrong-password': 'Sai email hoặc mật khẩu.',
                'auth/invalid-credential': 'Sai email hoặc mật khẩu.',
                'auth/too-many-requests': 'Đăng nhập thất bại quá nhiều lần. Vui lòng thử lại sau.',
                'auth/popup-closed-by-user': 'Bạn đã đóng cửa sổ đăng nhập Google.',
                'auth/cancelled-popup-request': 'Yêu cầu đăng nhập bị hủy.',
                'auth/popup-blocked': 'Trình duyệt đã chặn popup. Vui lòng cho phép popup và thử lại.',
                'auth/network-request-failed': 'Lỗi mạng. Vui lòng kiểm tra kết nối internet.',
            };
            return map[code] || `Lỗi: ${error.message || code}`;
        }

        // --- Tab switching ---
        window.switchTab = (tab) => {
            clearMsg();
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('panel-login').classList.toggle('active', tab === 'login');
            document.getElementById('panel-register').classList.toggle('active', tab === 'register');
        };

        // DEV ONLY: nếu backend đang bật bypass auth, không cần thao tác tại trang login.
        (async () => {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                isDevSkipAuth = !!data.devSkipAuth;
                if (isDevSkipAuth) {
                    showDevNote('DEV MODE đang bật (VITE_DEV_SKIP_AUTH=true). Hệ thống sẽ tự vào app, không cần đăng nhập.');
                    setTimeout(() => {
                        window.location.href = '/app';
                    }, 700);
                }
            } catch (_) {}
        })();

        // --- Send token to backend ---
        async function sendTokenToServer(user) {
            const idToken = await user.getIdToken(true);
            const rememberMe = document.getElementById('remember-me')?.checked || false;
            const res = await fetch('/sessionLogin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken, rememberMe })
            });
            const result = await res.json();
            if (res.ok && result.success) {
                window.location.href = '/app';
            } else {
                // Backend rejected — sign out Firebase client
                await signOut(auth);
                throw new Error(result.message || result.error || 'Tài khoản không có quyền truy cập');
            }
        }

        // --- EMAIL/PASSWORD LOGIN ---
        document.getElementById('btn-login').addEventListener('click', async () => {
            clearMsg();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            if (!email || !password) return showMsg('Vui lòng nhập email và mật khẩu.');

            const btn = document.getElementById('btn-login');
            setLoading(btn, true);
            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                await sendTokenToServer(cred.user);
            } catch (error) {
                showMsg(translateError(error));
            } finally {
                setLoading(btn, false);
            }
        });

        // Enter key support for login
        document.getElementById('login-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-login').click();
        });
        document.getElementById('login-email').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('login-password').focus();
        });

        // --- EMAIL/PASSWORD REGISTER ---
        document.getElementById('btn-register').addEventListener('click', async () => {
            clearMsg();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (!email || !password || !confirm) return showMsg('Vui lòng điền đầy đủ thông tin.');
            if (password !== confirm) return showMsg('Mật khẩu xác nhận không khớp.');
            if (password.length < 6) return showMsg('Mật khẩu phải có ít nhất 6 ký tự.');

            const btn = document.getElementById('btn-register');
            setLoading(btn, true);
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await sendTokenToServer(cred.user);
            } catch (error) {
                showMsg(translateError(error));
            } finally {
                setLoading(btn, false);
            }
        });

        // Enter key support for register
        document.getElementById('reg-confirm').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btn-register').click();
        });

        // --- GOOGLE SIGN-IN ---
        document.getElementById('btn-google').addEventListener('click', async () => {
            clearMsg();
            const btn = document.getElementById('btn-google');
            setLoading(btn, true);
            try {
                const result = await signInWithPopup(auth, googleProvider);
                await sendTokenToServer(result.user);
            } catch (error) {
                if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                    // User closed popup, not really an error
                } else {
                    showMsg(translateError(error));
                }
            } finally {
                setLoading(btn, false);
            }
        });
    </script>
</body>
</html>
