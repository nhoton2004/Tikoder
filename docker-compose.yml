services:
  tiktok-app:
    build: .
    container_name: tiktok_order_app
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - ./history:/app/history
      - ./config.json:/app/config.json
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    env_file:
      - .env
    restart: "no"
