name: tikoder
services:
  tiktok-app:
    image: ${TIKODER_IMAGE:-tikoder:local}
    build: .
    init: true
    env_file: .env
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV:-development}
      PORT: "3000"
      SESSION_STORE: sqlite
      SESSION_DB_PATH: /app/data/sessions.sqlite
      FIREBASE_CREDENTIALS_FILE: /app/firebase-service-account.json
      VITE_DEV_SKIP_AUTH: "false"
      ZALO_WEB_EXPERIMENTAL: "false"
      TRUST_PROXY: ""
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./history
        target: /app/history
        bind:
          create_host_path: false
      - type: bind
        source: ./config.json
        target: /app/config.json
        bind:
          create_host_path: false
      - type: bind
        source: ./firebase-service-account.json
        target: /app/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
